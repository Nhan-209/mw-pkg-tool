[package]
name = "mw-pkg-tool"
version = "0.2.1"
edition = "2021"
authors = ["Nhan-209"]
description = "Ultra-fast standalone Mini World .PKG archive unpacker and repacker"
readme = "README.md"
license = "MIT"

[dependencies]
lz4_flex = "0.11"
md-5 = "0.10"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
clap = { version = "4.5", features = ["derive"] }
anyhow = "1.0"
walkdir = "2.5"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
